- intent: unblock_threat
  examples: |
    - unblock domain [www.google.com](domain)
    - unblock ip [8.8.8.8](ip)
    - remove domain [badsite.com](domain) from blocklist
    - unban domain [malicious.com](domain)
    - whitelist ip [1.1.1.1](ip)
    - lift ban on hash [8f4e3c2b1a0f9e8d7c6b5a4f3e2d1c0b](file_hash)
