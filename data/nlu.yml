- intent: generate_report
  examples: |
    - generate an incident report
    - compile the security event log
    - export response activities report
    - create an incident audit log
    - build the security compliance report
    - download the remediation summary
    - generate report
    - give me report

- intent: show_latest_report
  examples: |
    - show me the latest report
    - display the last incident log
    - view audit report
    - show report
    - fetch latest forensic report

- intent: check_ip_reputation
  examples: |
    - Check reputation for IP [185.220.101.5](ip_address)
    - Is [192.168.1.50](ip_address) malicious?
    - What is the threat score for [45.33.32.156](ip_address)?
    - Scan IP address [103.21.244.0](ip_address)

- intent: analyze_log_file
  examples: |
    - Please analyze the log file at [uploads/syslog.log](log_path)
    - Parse [uploads/auth.log](log_path) for threat indicators
    - Scan this uploaded log [uploads/firewall.txt](log_path)

- intent: approve_block_ip
  examples: |
    - Approve blocking IP [185.220.101.5](ip_address)
    - Yes, proceed with firewall block for [185.220.101.5](ip_address)
    - Block [185.220.101.5](ip_address) on firewall
