    - block domain [bad-actor.ru](domain)
    - restrict communication with IP [172.16.254.1](ip)
    - block the domain [malicious-site.com](domain)
    - completely block domain [dangerous-web.biz](domain)
    - block ip [8.8.8.8](ip)
